[pytest]
python_files = test_*.py tests_*.py *_test.py *_tests.py
python_functions = test_*
# asyncio_mode = auto # TestClient handles async calls, not strictly needed for these tests.
# Add other configurations if needed, e.g., log level, default paths.
# Example for logging:
# log_cli = true
# log_cli_level = INFO
# log_file = pytest.log
# log_file_level = DEBUG
# log_file_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
# log_file_date_format = %Y-%m-%d %H:%M:%S

# Environment variables for tests (if needed, though .env should be handled by config)
# Example:
# env =
#   MY_TEST_VARIABLE=some_value
#   PYTHONPATH=.  # Ensures src can be imported if tests are run from root
# (PYTHONPATH=. is often good practice if not using editable installs)

# For FastAPI TestClient, ensure that the application instance is correctly imported.
# If tests are in a 'tests' directory and app is in 'src', PYTHONPATH might need adjustment
# or the tests should be runnable as a module.
# Adding PYTHONPATH=. is a common way to handle this if tests are run from the project root.
# However, if you install your package in editable mode (pip install -e .),
# or structure your project so `src` is automatically on the path, this might not be needed.
# For now, we assume the environment or test runner handles path correctly.
# If ModuleNotFoundError occurs for `src.main`, adding `pythonpath = .` or `src` might be needed.
# Let's add it to be safe, common in many projects.
pythonpath = . src

# Filter warnings - useful to hide common warnings that are not critical for your tests
# filterwarnings =
#    ignore::DeprecationWarning
#    ignore::UserWarning
